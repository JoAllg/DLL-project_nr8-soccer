defaults: &defaults
  total_steps: 25000000

position_templates:
  # Ball
  ball_right_before_goal: &ball_right_before_goal
    min: [0.6, -0.6]
    max: [0.9, 0.6]

  ball_middle: &ball_middle
    min: [-0.2, -0.6]
    max: [0.2, 0.6]

  ball_left_before_goal: &ball_left_before_goal
    min: [-0.9, -0.6]
    max: [-0.6, 0.6]

  # Robots
  blue_half: &blue_half
    min: [-0.8, -0.8]
    max: [-0.1, 0.8]

  blue_opponents_half: &blue_opponents_half
    min: [0, -0.8]
    max: [0.8, 0.8]

  right_third: &right_third
    min: [0.4, -0.6]
    max: [0.8, 0.6]

  yellow_half: &yellow_half
    min: [0.1, -0.8]
    max: [0.8, 0.8]

  yellow_before_goal: &yellow_before_goal
    min: [0.4, -0.4]
    max: [0.9, 0.4]

# Available rewards (reference for templates below)
# proximity (ps*): distance to ball (closer = higher reward)
# progress (ps*): ball progress towards goal
# kick_forward (ps*): robot kicks ball with a forward (+x) component
# kick (ps*): robot kicks ball in any direction (use for passing)
# kick_velocity (ps*): ball kick-velocity (forward direction) reward (discontinoud)
# dribble (ps*): teammate keeps ball at dribbler (use small weight)
# spacing (ps*): crowding penalty when blue robots clump close
# pass (ps*): pulse when a passed ball reaches a different teammate (0 for solo; small weight)
# goal: goal scored
# goal_close: goal scored if shot from the last third of the playing field
# out_of_bounds (ps*): BALL left the playing field (penalty; use a positive weight, value already negative)
# time (ps*): flat per-step penalty, makes ending the episode sooner worth more (penalty; positive weight, value already negative)
# (ps*) = per-step reward: evaluated each step and collectable repeatedly within an episode (dense or event-triggered), so keep the weight small

reward_templates:
  default: &default_rw
    goal: 100
    progress: 0.8
    proximity: 0.1
    kick_forward: 0.1

  solo: &solo_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.5
    kick_forward: 0.5
    time: 0.0005  # -1/episode at max_steps=1000

  # Needs warmstart from solo reward stage 
  coop: &coop_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.3
    kick_forward: 0.4
    pass: 0.3
    dribble: 0.01
    spacing: 0.03
    out_of_bounds: 0.05

  # "Annealed" late-stage variant of `coop`
  reduced: &reduced_rw
    goal: 50  # match
    goal_close: 50  # match
    progress: 0.8  # match
    proximity: 0.15  # faded (coop 0.3)
    kick_forward: 0.2  # faded (coop 0.4)
    pass: 0.3  # match
    dribble: 0.01  # match
    spacing: 0.03  # match
    out_of_bounds: 0.05  # match
    time: 0.001  # match

  # Passing-dominant stage: pass pulse outweighs a full progress run
  # (progress telescopes to ~7-9/episode), scoring still worth chaining passes.
  passing: &passing_rw
    goal: 50  # match coop
    goal_close: 50  # match coop
    progress: 0.4  # halved (coop 0.8): dribbling upfield must not beat passing
    proximity: 0.15  # halved (coop 0.3): less ball-chasing, more open receivers
    kick_forward: 0.15  # cut (coop 0.4): sideways/back passes should not be punished
    kick: 0.3  # any-direction kick, seeds pass attempts
    pass: 5.0  # boosted 16x (coop 0.3): ~2 passes == one progress run
    dribble: 0.03  # raised (coop 0.01): hold ball to aim
    spacing: 0.1  # raised (coop 0.03): spread out to open pass lanes
    out_of_bounds: 0.1  # raised (coop 0.05): stray passes cost something
    time: 0.001  # match coop

  # Pure-passing stage
  purepassing: &purepassing_rw
    proximity: 0.4
    kick: 0.3
    pass: 1.0
    spacing: 0.2
    out_of_bounds: 0.1
    # dribble: 0.05

stages:
  - name: "1vs0yellow-half"
    total_steps: 10000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw

  - name: "1vs0random"
    total_steps: 10000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        <<: *solo_rw

  - name: "1vs0yellow_half_coop"
    total_steps: 5000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *coop_rw

  - name: "1vs0random_coop"
    total_steps: 5000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        <<: *coop_rw

  - name: "2vs0yellow-half"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *coop_rw

  - name: "2vs0game"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      # Startpositions similar to a normal game
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *coop_rw

  - name: "2vs0game_passing"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      # Startpositions similar to a normal game
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *passing_rw

  - name: "2vs2random"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      # spawn everything random on the field
      rewards:
        <<: *coop_rw

