  #       <<: *ball_middle
  #     allowed_positions_blue:
  #       <<: *blue_half
  #     allowed_positions_yellow:
  #       <<: *yellow_half
  #     rewards:
  #       <<: *coop_rw

  - name: "2vs2game_ou"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Uhlstein"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *coop_rw

  - name: "2vs2block"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *coop_rw

