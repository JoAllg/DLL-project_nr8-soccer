defaults: &defaults
  total_steps: 16000000

position_templates:
  # Ball
  ball_right_before_goal: &ball_right_before_goal
    min: [0.6, -0.6]
    max: [0.9, 0.6]

  ball_middle: &ball_middle
    min: [-0.2, -0.6]
    max: [0.2, 0.6]

  ball_left_before_goal: &ball_left_before_goal
    min: [-0.9, -0.6]
    max: [-0.6, 0.6]

  # Robots
  blue_half: &blue_half
    min: [-0.8, -0.8]
    max: [-0.1, 0.8]

  blue_opponents_half: &blue_opponents_half
    min: [0, -0.8]
    max: [0.8, 0.8]

  right_third: &right_third
    min: [0.4, -0.6]
    max: [0.8, 0.6]

  yellow_half: &yellow_half
    min: [0.1, -0.8]
    max: [0.8, 0.8]

  yellow_before_goal: &yellow_before_goal
    min: [0.4, -0.4]
    max: [0.9, 0.4]

# Available rewards (reference for templates below)
# proximity (ps*): distance to ball (closer = higher reward)
# progress (ps*): ball progress towards goal
# kick_forward (ps*): robot kicks ball with a forward (+x) component
# kick (ps*): robot kicks ball in any direction (use for passing)
# kick_velocity (ps*): ball kick-velocity (forward direction) reward (discontinuous)
# dribble (ps*): teammate keeps ball at dribbler (use small weight)
# spacing (ps*): crowding penalty when blue robots clump close
# pass (ps*): pulse when a passed ball reaches a different teammate (0 for solo; small weight)
# pass_forward (ps*): like pass but scaled by how much the pass advances toward goal [MUSKAN]
# spread (ps*): reward for robots maintaining spatial separation [MUSKAN]
# pass_to_shot (ps*): bonus when a shot follows a pass within 15 steps [MUSKAN]
# goal: goal scored
# goal_close: goal scored if shot from the last third of the playing field
# out_of_bounds (ps*): BALL left the playing field (penalty; use a positive weight, value already negative)
# (ps*) = per-step reward: evaluated each step and collectable repeatedly within an episode

reward_templates:
  default: &default_rw
    goal: 100
    progress: 0.8
    proximity: 0.1
    kick_forward: 0.1

  solo: &solo_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.5
    kick_forward: 0.5

  # Needs warmstart from solo reward stage
  coop: &coop_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.3
    kick_forward: 0.4
    pass: 0.3
    dribble: 0.01
    spacing: 0.02
    out_of_bounds: 0.05

  # "Annealed" late-stage variant of `coop`
  reduced: &reduced_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.15
    kick_forward: 0.2
    pass: 0.3
    dribble: 0.01
    spacing: 0.02
    out_of_bounds: 0.05

  # Pure-passing stage
  passing: &passing_rw
    proximity: 0.4
    kick: 0.3
    pass: 1.0
    spacing: 0.2
    out_of_bounds: 0.1

  # Quality-passing: rewards forward passes, positioning, and assist->shot sequences [MUSKAN]
  quality_passing: &quality_passing_rw
    goal: 50
    goal_close: 50
    progress: 0.6
    proximity: 0.1
    kick_forward: 0.1
    pass_forward: 0.2
    spread: 0.05
    pass_to_shot: 0.2
    spacing: 0.02
    out_of_bounds: 0.05

  quality_passing_block: &quality_passing_block_rw
    goal: 50
    goal_close: 50
    progress: 0.6
    proximity: 0.1
    kick_forward: 0.1
    pass_forward: 0.3    # increase, passing is the point here
    spread: 0.1          # increase, need robots to separate against blocker
    pass_to_shot: 0.3    # increase, reward the full sequence
    spacing: 0.02
    out_of_bounds: 0.05

  passing_only: &passing_only_rw
    proximity: 0.1
    kick: 0.3
    pass_forward: 5.0
    spread: 0.3
    pass_to_shot: 1.0
    spacing: 0.02
    out_of_bounds: 0.05

  passing_only_v2: &passing_only_v2_rw
    proximity: 0.1
    kick: 0.3
    pass_forward: 20.0
    spread: 0.05
    spacing: 0.3
    out_of_bounds: 0.05
    off_ball_positioning: 0.2
    receiver_positioning: 0.3
    kick_without_receiver: 0.3

  passing_to_goal_v2: &passing_to_goal_v2_rw
    goal: 50
    goal_close: 50
    progress: 0.6
    proximity: 0.1
    kick_forward: 0.1
    pass_forward: 10.0
    spread: 0.05
    spacing: 0.3
    out_of_bounds: 0.05
    off_ball_positioning: 0.1
    receiver_positioning: 0.1

stages:
  - name: "1vs0"
    <<: *defaults
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw

  - name: "1vs0random"
    <<: *defaults
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        <<: *solo_rw

  - name: "2vs0"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw

  - name: "2vs0game"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2random"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      rewards:
        <<: *solo_rw

  - name: "2vs2"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Random"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2ou"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Uhlstein"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2block"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2opponent"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Agent"
      opponent_model: "models/config_stage2_2vs2_v1.cleanrl_model"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "3vs0passing"
    <<: *defaults
    environment:
      n_robots_blue: 3
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      rewards:
        <<: *passing_rw

  - name: "2vs0passing"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *coop_rw

  - name: "2vs0quality_passing"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      rewards:
        <<: *quality_passing_rw

  - name: "2vs2block_passing"
    <<: *defaults
    num_minibatches: 16    # was 32, doubles minibatch from 2,048 to 4,096
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *quality_passing_block_rw
  
  - name: "2vs0passing_only"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      rewards:
        <<: *passing_only_rw

  - name: "2vs2passing_only"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *passing_only_rw

  - name: "2vs0passing_to_goal"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      rewards:
        <<: *quality_passing_rw

  - name: "2vs2passing_to_goal"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *quality_passing_block_rw
  
  - name: "2vs0passing_only_v2"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      rewards:
        <<: *passing_only_v2_rw

  - name: "2vs2passing_only_v2"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *passing_only_v2_rw

  - name: "2vs2passing_to_goal_v2"
    <<: *defaults
    total_steps: 8000000
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *passing_to_goal_v2_rw