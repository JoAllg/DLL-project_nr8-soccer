defaults: &defaults
  total_steps: 16000000

position_templates:
  # Ball
  ball_right_before_goal: &ball_right_before_goal
    min: [0.6, -0.6]
    max: [0.9, 0.6]

  ball_middle: &ball_middle
    min: [-0.2, -0.6]
    max: [0.2, 0.6]

  ball_left_before_goal: &ball_left_before_goal
    min: [-0.9, -0.6]
    max: [-0.6, 0.6]

  # Robots
  blue_half: &blue_half
    min: [-0.8, -0.8]
    max: [-0.1, 0.8]

  blue_opponents_half: &blue_opponents_half
    min: [0, -0.8]
    max: [0.8, 0.8]

  right_third: &right_third
    min: [0.4, -0.6]
    max: [0.8, 0.6]

  yellow_half: &yellow_half
    min: [0.1, -0.8]
    max: [0.8, 0.8]

  yellow_before_goal: &yellow_before_goal
    min: [0.4, -0.4]
    max: [0.9, 0.4]

# Available rewards (reference for templates below)
# proximity (ps*): distance to ball (closer = higher reward)
# progress (ps*): ball progress towards goal
# kick_forward (ps*): robot kicks ball with a forward (+x) component
# kick (ps*): robot kicks ball in any direction (use for passing)
# kick_velocity (ps*): ball kick-velocity (forward direction) reward (discontinoud)
# dribble (ps*): teammate keeps ball at dribbler (use small weight)
# spacing (ps*): crowding penalty when blue robots clump close
# pass (ps*): pulse when a passed ball reaches a different teammate (0 for solo; small weight)
# goal: goal scored
# goal_close: goal scored if shot from the last third of the playing field
# out_of_bounds (ps*): BALL left the playing field (penalty; use a positive weight, value already negative)
# time (ps*): flat per-step penalty so idling is never optimal (penalty; positive weight, value already negative)
# (ps*) = per-step reward: evaluated each step and collectable repeatedly within an episode (dense or event-triggered), so keep the weight small

reward_templates:
  default: &default_rw
    goal: 100
    progress: 0.8
    proximity: 0.1
    kick_forward: 0.1

  solo: &solo_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.5
    kick_forward: 0.5

  # Needs warmstart from solo reward stage 
  coop: &coop_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.3
    kick_forward: 0.4
    pass: 0.3
    dribble: 0.01
    spacing: 0.02
    out_of_bounds: 0.05
    time: 0.001  # -1/episode at max_steps=1000, enough to break idle ties

  # "Annealed" late-stage variant of `coop`
  reduced: &reduced_rw
    goal: 50  # match
    goal_close: 50  # match
    progress: 0.8  # match
    proximity: 0.15  # faded (coop 0.3)
    kick_forward: 0.2  # faded (coop 0.4)
    pass: 0.3  # match
    dribble: 0.01  # match
    spacing: 0.02  # match
    out_of_bounds: 0.05  # match
    time: 0.001  # match

  # Pure-passing stage
  passing: &passing_rw
    proximity: 0.4
    kick: 0.3
    pass: 1.0
    spacing: 0.2
    out_of_bounds: 0.1
    # dribble: 0.05

stages:
  - name: "1vs0yellow-half"
    total_steps: 8000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw

  - name: "1vs0random"
    total_steps: 10000000
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        <<: *solo_rw

  - name: "2vs0"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw
        # TODO: reduce goal_close for teamwork

  - name: "2vs0game"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      # Startpositions similar to a normal game
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2random"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      # spawn everything random on the field
      rewards:
        <<: *solo_rw

  - name: "2vs2"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Random"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2ou"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Uhlstein"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2block"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2opponent"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Agent"
      opponent_model: "models/config_stage2_2vs2_v1.cleanrl_model"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "3vs0passing"
    <<: *defaults
    environment:
      n_robots_blue: 3
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_middle
      rewards:
        <<: *passing_rw
