defaults: &defaults
  total_steps: 16000000

position_templates:
  # Ball
  ball_right_before_goal: &ball_right_before_goal
    min: [0.6, -0.6]
    max: [0.9, 0.6]

  ball_middle: &ball_middle
    min: [-0.2, -0.6]
    max: [0.2, 0.6]

  ball_left_before_goal: &ball_left_before_goal
    min: [-0.9, -0.6]
    max: [-0.6, 0.6]

  # Robots
  blue_half: &blue_half
    min: [-0.8, -0.8]
    max: [-0.1, 0.8]

  blue_opponents_half: &blue_opponents_half
    min: [0, -0.8]
    max: [0.8, 0.8]

  right_third: &right_third
    min: [0.4, -0.6]
    max: [0.8, 0.6]

  yellow_half: &yellow_half
    min: [0.1, -0.8]
    max: [0.8, 0.8]

  yellow_before_goal: &yellow_before_goal
    min: [0.4, -0.4]
    max: [0.9, 0.4]

# Available rewards (reference for templates below)
# proximity: distance to ball (closer = higher reward)
# progress: ball progress towards goal
# kick_forward: robot kicks ball with a forward (+x) component
# kick: robot kicks ball in any direction (use for passing)
# kick_velocity: ball kick-velocity (forward direction) reward (discontinoud)
# dribble: teammate keeps ball at dribbler (use small weight)
# spacing: crowding penalty when blue robots clump close
# pass: pulse when a passed ball reaches a different teammate (0 for solo; small weight)
# goal: goal scored
# goal_close: goal scored if shot from the last third of the playing field
# out_of_bounds: ball left the playing field (penalty; use a positive weight, value already negative)

reward_templates:
  standard: &standard_rw
    proximity: 0.1
    progress: 0.8
    kick_forward: 0.1
    goal_close: 100

  solo: &solo_rw
    proximity: 0.5
    progress: 0.8
    kick_forward: 0.5
    goal_close: 50

  # solo: &solo_rw
  #   proximity: 0.1
  #   progress: 1.0
  #   kick_forward: 0.5
  #   dribble: 0.05
  #   spacing: 0.1
  #   pass: 0.1
  #   goal_close: 100
  #   out_of_bounds: 0.1

  # "Annealed" late-stage variant of `solo`
  reduced: &reduced_rw
    proximity: 0.02   # very small compared to &solo_rw
    progress: 1.0     # full
    kick_forward: 0.1         # small
    dribble: 0.005      # very small
    spacing: 0.1 # full
    pass: 0.1 # full
    goal_close: 100   # full
    out_of_bounds: 0.1  # full

  passing: &passing_rw
    out_of_bounds: 0.1
    proximity: 0.1
    dribble: 0.05
    spacing: 0.2
    kick: 0.2
    pass: 1.0

stages:
  - name: "1vs0"
    <<: *defaults
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw

  - name: "1vs0random"
    <<: *defaults
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        <<: *solo_rw

  - name: "2vs0"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      allowed_positions_ball:
        <<: *ball_right_before_goal
      allowed_positions_blue:
        <<: *right_third
      rewards:
        <<: *solo_rw
        # TODO: reduce goal_close for teamwork

  - name: "2vs0game"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
      # Startpositions similar to a normal game
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2random"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      # spawn everything random on the field
      rewards:
        <<: *solo_rw

  - name: "2vs2"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Random"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2ou"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Uhlstein"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2block"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Block"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "2vs2opponent"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
      opponent_strategy: "Agent"
      opponent_model: "models/config_stage2_2vs2_v1.cleanrl_model"
      allowed_positions_ball:
        <<: *ball_middle
      allowed_positions_blue:
        <<: *blue_half
      allowed_positions_yellow:
        <<: *yellow_half
      rewards:
        <<: *solo_rw

  - name: "3vs0passing"
    <<: *defaults
    environment:
      n_robots_blue: 3
      n_robots_yellow: 3
      opponent_strategy: "Uhlstein"
      allowed_positions_ball:
        <<: *ball_middle
      rewards:
        <<: *passing_rw
