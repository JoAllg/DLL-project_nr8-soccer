defaults: &defaults
  steps: 8000

stages:
  - name: "1 Single robot shoot"
    <<: *defaults
    environment:
      n_robots_blue: 3
      n_robots_yellow: 2

  - name: "2 robots"
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0
    <<: *defaults

  - name: "2 vs 2 static"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2

