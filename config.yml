defaults: &defaults
  iterations: 250

stages:
  - name: "1v0"
    <<: *defaults
    environment:
      n_robots_blue: 1
      n_robots_yellow: 0
      rewards:
        # reward name: weight; each reward is normalized to [-1, 1] per step, # so weights are directly comparable (goal is a one-time event bonus)
        proximity: 0.1
        progress: 0.8
        kick: 0.1
        goal: 100

  - name: "2v0"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 0

  - name: "2vs2 static"
    <<: *defaults
    environment:
      n_robots_blue: 2
      n_robots_yellow: 2
