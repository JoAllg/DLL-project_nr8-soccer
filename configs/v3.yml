defaults: &defaults
  total_steps: 16000000

position_templates:
  # Ball
  ball_right_before_goal: &ball_right_before_goal
    min: [0.6, -0.6]
    max: [0.9, 0.6]

  ball_middle: &ball_middle
    min: [-0.2, -0.6]
    max: [0.2, 0.6]

  ball_left_before_goal: &ball_left_before_goal
    min: [-0.9, -0.6]
    max: [-0.6, 0.6]

  # Robots
  blue_half: &blue_half
    min: [-0.8, -0.8]
    max: [-0.1, 0.8]

  blue_opponents_half: &blue_opponents_half
    min: [0, -0.8]
    max: [0.8, 0.8]

  right_third: &right_third
    min: [0.4, -0.6]
    max: [0.8, 0.6]

  yellow_half: &yellow_half
    min: [0.1, -0.8]
    max: [0.8, 0.8]

  yellow_before_goal: &yellow_before_goal
    min: [0.4, -0.4]
    max: [0.9, 0.4]

## Available rewards (reference for templates below)
# proximity (ps*): distance to ball (closer = higher reward)
# progress (ps*): ball progress towards goal
# kick_forward (ps*): robot kicks ball with a forward (+x) component
# kick (ps*): robot kicks ball in any direction (use for passing)
# dribble (ps*): teammate keeps ball at dribbler (use small weight)
# goal: goal scored
# goal_close: goal scored if shot from the last third of the playing field
# time (ps*): flat per-step penalty, makes ending the episode sooner worth more

## Teamwork
# spread (ps*): reward for robots maintaining spatial separation
# receiver_positioning (ps*): reward for non-closest robot holding good receiving spot
# off_ball_positioning (ps*): penalty for non-closest robot crowding the ball
# spacing (ps*): crowding penalty when blue robots clump close

# pass (ps*): pulse when a passed ball reaches a different teammate (small weight)
# pass_forward (ps*): like pass but scaled by how much the pass advances toward goal
# pass_to_shot (ps*): bonus when a shot follows a pass within 15 steps
# kick_without_receiver (ps*): penalty for kicking with no teammate positioned to receive

# (ps*) = per-step reward: evaluated each step and collectable repeatedly within an episode (dense or event-triggered), so keep the weight small

## Discontinued
# kick_velocity (ps*): ball kick-velocity (forward direction) reward
# out_of_bounds (ps*): BALL left the playing field (penalty; use a positive weight, value already negative)

reward_templates:
  default: &default_rw
    goal: 100
    progress: 0.8
    proximity: 0.1
    kick_forward: 0.1

  solo: &solo_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.5
    kick_forward: 0.5
    time: 0.0005  # -1/episode at max_steps=1000

  # Needs warmstart from solo reward stage 
  coop: &coop_rw
    goal: 50
    goal_close: 50
    progress: 0.8
    proximity: 0.1
    kick_forward: 0.1
    kick: 0.25
    pass: 0.35
    dribble: 0.02
    spacing: 0.03
    time: 0.001

  # # "Annealed" late-stage variant of `coop`
  # reduced: &reduced_rw
  #   goal: 50  # match
  #   goal_close: 50  # match
  #   progress: 0.8  # match
  #   proximity: 0.15  # faded (coop 0.3)
  #   kick_forward: 0.2  # faded (coop 0.4)
  #   pass: 0.3  # match
  #   dribble: 0.01  # match
  #   spacing: 0.03  # match
  #   time: 0.001  # match

  # # Passing-dominant stage: pass pulse outweighs a full progress run
  # # (progress telescopes to ~7-9/episode), scoring still worth chaining passes.
  # passing: &passing_rw
  #   goal: 50  # match coop
  #   goal_close: 50  # match coop
  #   progress: 0.4  # halved (coop 0.8): dribbling upfield must not beat passing
  #   proximity: 0.15  # halved (coop 0.3): less ball-chasing, more open receivers
  #   kick_forward: 0.15  # cut (coop 0.4): sideways/back passes should not be punished
  #   kick: 0.3  # any-direction kick, seeds pass attempts
  #   pass: 5.0  # boosted 16x (coop 0.3): ~2 passes == one progress run
  #   dribble: 0.03  # raised (coop 0.01): hold ball to aim
  #   spacing: 0.1  # raised (coop 0.03): spread out to open pass lanes
  #   time: 0.001  # match coop

  # Quality-passing: rewards forward passes, positioning, and assist->shot sequences
  quality_passing: &quality_passing_rw
    goal: 20
    goal_close: 70
    progress: 0.6
    proximity: 0.01
    kick_forward: 0.1
    pass: 0.1
    pass_forward: 0.1
    spread: 0.05
    pass_to_shot: 0.2
    spacing: 0.02
    time: 0.001

  quality_passing_block: &quality_passing_block_rw
    goal: 20
    goal_close: 70
    progress: 0.6
    proximity: 0.01
    kick_forward: 0.1
    pass: 0.15
    pass_forward: 0.15    # increase, passing is the point here
    spread: 0.1          # increase, need robots to separate against blocker
    pass_to_shot: 0.3    # increase, reward the full sequence
    spacing: 0.02
    time: 0.001

  passing_only: &passing_only_rw
    proximity: 0.01
    kick: 0.3
    pass: 2.0
    pass_forward: 3.0
    spread: 0.3
    pass_to_shot: 1.0
    spacing: 0.02
    time: 0.001

  passing_only_v2: &passing_only_v2_rw
    proximity: 0.01
    kick: 0.3
    pass: 7.0
    pass_forward: 13.0
    spread: 0.05
    spacing: 0.3
    off_ball_positioning: 0.2
    receiver_positioning: 0.3
    kick_without_receiver: 0.3
    time: 0.001

  passing_to_goal_v2: &passing_to_goal_v2_rw
    goal_close: 50
    progress: 0.6
    proximity: 0.01
    kick_forward: 0.1
    pass: 4.0
    pass_forward: 6.0
    spread: 0.05
    spacing: 0.3
    off_ball_positioning: 0.2
    receiver_positioning: 0.3
    time: 0.001
  
  passing_only_v3: &passing_only_v3_rw
    proximity: 0.01
    kick: 0.3
    pass: 20.0
    pass_forward: 30.0
    spread: 0.05
    spacing: 0.3
    off_ball_positioning: 0.2
    receiver_positioning: 0.3
    time: 0.001

